name: Build ReelRush Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Release APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_BACKEND_URL: https://reelrush-production-39f5.up.railway.app
      BACKEND_URL: https://reelrush-production-39f5.up.railway.app
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build shared package
        run: |
          npm install --legacy-peer-deps
          npm run build:shared

      - name: Run Expo Prebuild for Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -PnewArchEnabled=false --no-daemon

      - name: Copy APK to ReelRush.apk
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk ./ReelRush.apk
          ls -lh ./ReelRush.apk

      - name: Upload ReelRush.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelRush-Android-APK
          path: ./ReelRush.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: "ReelRush Android APK (Latest)"
          body: |
            ### ReelRush — Fast. Clean. No Ads.
            Download and install **ReelRush.apk** directly on your Android phone to share with friends.
            - Includes native **Instagram → Share → ReelRush** support
            - Pre-connected to cloud backend (`reelrush-production-39f5.up.railway.app`)
          files: ./ReelRush.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
