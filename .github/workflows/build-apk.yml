name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ReelRush Release APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_BACKEND_URL: https://reelrush-production-39f5.up.railway.app
      BACKEND_URL: https://reelrush-production-39f5.up.railway.app
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies & build shared package
        run: |
          npm install --legacy-peer-deps
          npm run build:shared
          sed -i 's/kotlin = "1.9.24"/kotlin = "1.9.25"/g' node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml

      - name: Run Expo Prebuild for Android
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install --clean

      - name: Build Release APK with Gradle
        working-directory: apps/mobile/android
        run: |
          echo "" >> gradle.properties
          echo "android.kotlinVersion=1.9.25" >> gradle.properties
          echo "kotlinVersion=1.9.25" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          sed -i "s/1.9.24/1.9.25/g" build.gradle || true
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -PnewArchEnabled=false -Pandroid.kotlinVersion=1.9.25 --no-daemon

      - name: Copy APK to ReelRush.apk
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk ./ReelRush.apk
          ls -lh ./ReelRush.apk

      - name: Upload ReelRush.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelRush-APK
          path: ./ReelRush.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: "ReelRush Android APK (Latest)"
          body: |
            ## ReelRush Android APK
            - **Fast Auto-Download:** Automatically prepares & downloads Instagram Reels/Videos
            - **Direct Share Support:** Share directly from the Instagram app to ReelRush
            - **Auto Save to Gallery:** Requests storage permission and saves MP4 directly to your phone's gallery
            - **100% Ad-Free & Clean UI:** Custom splash screen, zero clutter
            
            ### How to Install
            1. Tap **ReelRush.apk** below under **Assets** to download.
            2. Open the downloaded file on your Android phone and tap **Install**.
          files: ./ReelRush.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
